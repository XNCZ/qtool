[package]
name = "qtool"
version = "0.2.1"
edition = "2024"
authors = ["xncz <xncz@outlook.com>"]
description = "Analysis toolbox for quantum computation: superconducting-qubit calibration fits with interactive plotly reports, plus quantum process tomography (QPT)."
license = "MIT"
repository = "https://github.com/xncz/qtool"
readme = "README.md"
keywords = ["quantum", "superconducting", "qubit", "tomography", "plotly"]
categories = ["science", "visualization", "mathematics"]
# docs/ 里是 GitHub Pages 与 README 用的截图；README 引的是绝对 raw URL，
# 打进 crate 只会让每个用户白下 3.6 MiB。
exclude = ["docs/"]

[lib]

[features]
default = ["plot"]
plot = ["dep:plotly"]

[dependencies]
faer = "0.24.4"
lmfit = "0.4"
plotly = { version = "0.14.1", optional = true }
rayon = "1.12.0"
roots = "0.0.8"
contour = "0.13"
geo = { version = "0.33", default-features = false }

[dev-dependencies]
rand = "0.10.2"

# 每个分析一份 demo，各自出**一张**报告卡片、写同名 HTML 到 plt/；没有 plot feature 时
# 这些目标不参与构建。
[[example]]
name = "s21_demo"
required-features = ["plot"]

[[example]]
name = "s21_power_demo"
required-features = ["plot"]

[[example]]
name = "qspec_demo"
required-features = ["plot"]

[[example]]
name = "qspec_z_demo"
required-features = ["plot"]

[[example]]
name = "rabi_demo"
required-features = ["plot"]

[[example]]
name = "iq_demo"
required-features = ["plot"]

[[example]]
name = "ramsey_demo"
required-features = ["plot"]

[[example]]
name = "t1_demo"
required-features = ["plot"]

[[example]]
name = "t2_echo_demo"
required-features = ["plot"]

[[example]]
name = "drag_amplitude_demo"
required-features = ["plot"]

[[example]]
name = "drag_coeff_demo"
required-features = ["plot"]

[[example]]
name = "drag_detuning_demo"
required-features = ["plot"]

[[example]]
name = "bloch_demo"
required-features = ["plot"]

# 批量拟合基准：只跑拟合、不画图，所以不挂 plot feature；与 qtool-py/bench 下的
# Python 对照脚本使用同一份确定性数据（逐位一致的 LCG 噪声）。
[[example]]
name = "s21_batch_bench"
