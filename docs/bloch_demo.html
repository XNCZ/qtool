<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qtool bloch demo</title>
<script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
</head>
<body style="margin:24px;background:#ffffff">
<style>.qtool-card{position:relative;box-sizing:border-box;background:#ffffff;border:2.5px solid #0f172a;border-radius:12px;padding:10px;box-shadow:4px 4px 0 0 #0f172a}/* 可选标题：骑在上边线上（纵向中心与边线中心重合），白底盖掉被它压住的那段边线 */.qtool-card-title{position:absolute;left:14px;top:-1.25px;transform:translateY(-50%);background:#ffffff;padding:0 8px;font-weight:700;font-size:16px;color:#1e293b}</style><div class="qtool-card" style="max-width:1000px"><div class="qtool-card-title">标定三基</div><div class="qtool-bloch" id="bloch"><style>
.qtool-bloch{font-family:system-ui,'Segoe UI',sans-serif;color:#1f2328}
/* 高度跟着宽度走（比例即网格的设计宽高） */
.qtool-bloch .qtool-plot{width:100%;max-height:85vh}
/* 球那块：与上排之间只留一道缝；比例取到接近正方——3D 场景按画布的高与宽里较小的一边放大，
   块越高球越大（高度另有 78vh 封顶，免得小窗口里把整页撑开） */
.qtool-bloch .qtool-sphere{margin-top:6px}
.qtool-bloch .qtool-sphere-plot{width:100%;max-height:78vh}
</style><style>.qtool-footer{margin-top:6px;text-align:right;font-size:11px;color:#9ca3af}</style><script type="text/javascript">
(function () {
  if (window.qtoolExport) { return; }
  var QE = {};
  var CDN = {
    fflate: "https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm",
    sheetjs: "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm",
    arrow: "https://cdn.jsdelivr.net/npm/apache-arrow@17.0.0/+esm"
  };

  /* 首次用到时才拉库；同一页里多个报告共用同一份（module 说明符按 URL 去重） */
  var libsPromise = null;
  function libs() {
    if (!libsPromise) {
      libsPromise = Promise.all([
        import(CDN.fflate), import(CDN.sheetjs)
      ]).then(function (mods) {
        QE.libs = QE.libs || {};
        QE.libs.zipSync = mods[0].zipSync;
        QE.libs.XLSX = mods[1].default || mods[1];
      });
    }
    return libsPromise;
  }

  /* Arrow 只在点它的按钮时才拉（最大的一份，别让 npz / xlsx 跟着付这个钱） */
  var arrowPromise = null;
  function arrowLib() {
    if (!arrowPromise) {
      arrowPromise = import(CDN.arrow).then(function (mod) {
        QE.libs = QE.libs || {};
        QE.libs.arrow = mod;
      });
    }
    return arrowPromise;
  }

  /* 载荷：从图 div 一路上溯，取最近一个带载荷的卡片里的 JSON 脚本。报告自己的图第一层就命中；
     嵌在宿主报告里的行面板（气泡里钉住的那份）自身不带载荷，命中的是宿主报告那一份——同一份
     数据只存一遍，按钮也就不会点了没反应。 */
  function payload(gd) {
    var node = gd.parentElement;
    while (node) {
      var found = node.querySelector('script[type="application/json"]');
      if (found) { return JSON.parse(found.textContent); }
      node = node.parentElement;
    }
    return null;
  }

  /* 单元格 → 文本：复数写字面量 re±|im|j（numpy、Python、MATLAB 三条都能读），其余原样 */
  function cellText(cell, kind) {
    if (cell === null || cell === undefined) { return ""; }
    if (kind === "complex") {
      var im = cell[1];
      return String(cell[0]) + (im < 0 ? "-" : "+") + String(Math.abs(im)) + "j";
    }
    return String(cell);
  }
  function tableRows(table) {
    return table.columns.map(function (c) { return table.data[c.key] || []; });
  }
  function rowCount(table) { return table.columns.length ? tableRows(table)[0].length : 0; }

  function header(payload) {
    var complexColumns = [];
    payload.tables.forEach(function (table) {
      table.columns.forEach(function (column) {
        if (column.kind === "complex") { complexColumns.push(table.name + "." + column.key); }
      });
    });
    /* 前言固定四行（版本行、复数列提示、块标记、列清单）——numpy 的 genfromtxt 要按行数
       跳过前言，行数恒定它才能写成一行；所以复数列提示行即使为空也照写 */
    var lines = ["# qtool " + payload.version + " | " + payload.timestamp.local +
                 " | " + payload.name,
                 "# complex columns: " + (complexColumns.length ? complexColumns.join(", ") : "(none)") +
                 "  (literal <re><sign><im>j; pandas: converters={<col>: complex})"];
    return lines.join("\n");
  }
  function textFile(payload, sep, ext, mime) {
    /* 主表（第一张）是**真 CSV**行；其余表整块注释掉——read_csv(comment="#") 与
       read_csv(comment_prefix="#") 因此只拿到主表，辅助表在文件里仍可读 */
    var blocks = payload.tables.map(function (table, index) {
      var units = table.columns.map(function (c) { return c.key + " [" + c.unit + "]"; });
      var body = [table.columns.map(function (c) { return c.key; }).join(sep)];
      var rows = tableRows(table);
      var count = rowCount(table);
      for (var i = 0; i < count; i++) {
        body.push(table.columns.map(function (c, j) {
          return cellText(rows[j][i], c.kind);
        }).join(sep));
      }
      if (index > 0) {
        body = body.map(function (line) { return "# " + line; });
      }
      return "# ---- " + table.name + " ----\n# columns: " + units.join(", ") + "\n" +
             body.join("\n");
    });
    /* 块之间不留空行：polars 的 CSV 读法会把空行读成一行 NaN（与全行注释叠在一起时直接报错），
       两种读法都靠 `#` 前缀认注释，不留空行就都干净 */
    return { ext: ext, mime: mime,
             blob: new Blob([header(payload) + "\n" + blocks.join("\n") + "\n"], { type: mime }) };
  }

  /* 一列的取值盒：n×1 的列向量（MATLAB 的字段、npy 的字段都用它）。复数列按 [re,im] 交错
     （complex128 / MATLAB complex double 同语义），文本与缺值落 NaN。 */
  function columnBox(table, index) {
    var rows = tableRows(table);
    var count = rowCount(table);
    if (table.columns[index].kind === "complex") {
      var pairs = [];
      for (var i = 0; i < count; i++) {
        var value = rows[index][i];
        var pair = (value !== null && value !== undefined) ? value : [NaN, NaN];
        pairs.push(pair[0], pair[1]);
      }
      return { values: Float64Array.from(pairs), shape: [count, 1], complex: true, dtype: "c16" };
    }
    var flat = [];
    for (var k = 0; k < count; k++) {
      var cell = rows[index][k];
      flat.push(typeof cell === "number" ? cell : NaN);
    }
    return { values: Float64Array.from(flat), shape: [count, 1], complex: false, dtype: "f8" };
  }

  /* 字段名的两种写法：**name 带单位**（`fits.dtype.names` 一眼看到 `t1 [s]`，也与 xlsx 表头
     同一套），**title 是干净的列名**（numpy 允许按字段名**或它的 title** 索引，所以
     `fits["t1"]` 与 `fits["t1 [s]"]` 都能取到同一列）。 */
  function fieldName(column) { return column.key + " [" + column.unit + "]"; }

  /* numpy 的 structured array：一表一条 (n,) 记录数组，字段 = 列。
     容器自己拼（npy v1：magic + 版本 + 头长度 + 头 + 缓冲）——npyjs 只会写单 dtype 的普通
     数组，而我们要的是带字段名与逐列类型的 descr。类型：实数列 <f8、复数列 <c16、
     外键列 <i8（整数，不再是浮点）。 */
  function npyStructured(table) {
    var columns = tableRows(table);
    var count = rowCount(table);
    var fields = table.columns.map(function (column) {
      return { title: column.key, name: fieldName(column), kind: column.kind,
               dtype: column.kind === "complex" ? "<c16" : (column.kind === "ref" ? "<i8" : "<f8"),
               size: column.kind === "complex" ? 16 : 8 };
    });
    var descr = fields.map(function (f) {
      return "(('" + f.title + "', '" + f.name + "'), '" + f.dtype + "')";
    }).join(", ");
    var dict = "{'descr': [" + descr + "], 'fortran_order': False, 'shape': (" + count + ",), }";
    /* 头用空格补到 (10 + 头长) % 64 == 0，且以 \n 收尾——numpy 的 v1 规矩 */
    var pad = (64 - ((10 + dict.length + 1) % 64)) % 64;
    var head = dict + new Array(pad + 1).join(" ") + "\n";
    var magic = new Uint8Array(10);
    magic.set([0x93, 0x4e, 0x55, 0x4d, 0x50, 0x59], 0);        /* \x93 N U M P Y */
    magic[6] = 1; magic[7] = 0;                                 /* v1 */
    new DataView(magic.buffer).setUint16(8, head.length, true); /* 头长度（含 \n 与补白） */
    var width = fields.reduce(function (sum, f) { return sum + f.size; }, 0);
    var buffer = new ArrayBuffer(width * count);
    var view = new DataView(buffer);
    var offset = 0;
    for (var i = 0; i < count; i++) {
      for (var j = 0; j < fields.length; j++) {
        var value = columns[j][i];
        if (fields[j].kind === "complex") {
          var pair = (value !== null && value !== undefined) ? value : [NaN, NaN];
          view.setFloat64(offset, pair[0], true);
          view.setFloat64(offset + 8, pair[1], true);
        } else if (fields[j].kind === "ref") {
          view.setBigInt64(offset, BigInt(typeof value === "number" ? Math.round(value) : 0), true);
        } else {
          view.setFloat64(offset, typeof value === "number" ? value : NaN, true);
        }
        offset += fields[j].size;
      }
    }
    var bytes = new Uint8Array(10 + head.length + buffer.byteLength);
    bytes.set(magic, 0);
    bytes.set(new TextEncoder().encode(head), 10);
    bytes.set(new Uint8Array(buffer), 10 + head.length);
    return bytes;
  }

  /* 一表一条 Arrow IPC file（Feather v2）。Arrow 没有复数类型，复数列拆成 `<列名>_re` 与
     `<列名>_im` 两列；单位进**字段元数据** `unit`（Rust 侧 `f.metadata().get("unit")`、R 侧
     `sch$GetFieldByName("fq")$metadata` 都从这里读）；外键列落 int64，其余实数落 float64。 */
  function arrowTable(table) {
    var A = QE.libs.arrow;
    var rows = tableRows(table);
    var count = rowCount(table);
    var fields = [];
    var vectors = [];
    table.columns.forEach(function (column, index) {
      var unit = new Map([["unit", column.unit]]);
      var push = function (key, values, type) {
        fields.push(new A.Field(key, type, true, unit));
        vectors.push(A.makeVector(values));
      };
      var values = rows[index];
      var point = 0;
      if (column.kind === "complex") {
        var re = new Float64Array(count);
        var im = new Float64Array(count);
        for (point = 0; point < count; point++) {
          var pair = values[point];
          re[point] = pair ? pair[0] : NaN;
          im[point] = pair ? pair[1] : NaN;
        }
        push(column.key + "_re", re, new A.Float64());
        push(column.key + "_im", im, new A.Float64());
        return;
      }
      if (column.kind === "ref") {
        var keys = new BigInt64Array(count);
        for (point = 0; point < count; point++) {
          var key = values[point];
          keys[point] = BigInt(typeof key === "number" ? Math.round(key) : 0);
        }
        push(column.key, keys, new A.Int64());
        return;
      }
      var floats = new Float64Array(count);
      for (point = 0; point < count; point++) {
        var cell = values[point];
        floats[point] = typeof cell === "number" ? cell : NaN;
      }
      push(column.key, floats, new A.Float64());
    });
    /* 元数据只活在 schema 上，所以得自己装配：`new Table(schema, ...vectors)` 那条路走不通——
       Table 的构造器会把向量当可迭代对象摊成标量，行数直接归零（实测 0 rows）。 */
    var data = A.makeData({
      type: new A.Struct(fields), length: count, nullCount: 0,
      children: vectors.map(function (vector) { return vector.data[0]; })
    });
    return new A.Table(new A.RecordBatch(new A.Schema(fields), data));
  }

  /* MAT v5（level 5）二进制：一个变量一个 miMATRIX，元素是 double（有复数列时按复数落）。
     编码按 MathWorks 的格式文档，字段次序与 scipy.io.savemat 的产物逐字节一致：
     128 字节头（文本 + 8 字节子系统指针 + 版本 00 01 + 'IM'）之后，每个变量 = 标签(miMATRIX)
     + 数组标志(miUINT32，低位=类别 6、0x0800 位=复数) + 维度(miINT32，先行后列) + 变量名(miINT8)
     + pr/pi(miDOUBLE)，各子元素的数据按 8 字节对齐补齐。 */
  function u32(value) {
    var bytes = new Uint8Array(4);
    new DataView(bytes.buffer).setUint32(0, value, true);
    return bytes;
  }
  function i32(value) {
    var bytes = new Uint8Array(4);
    new DataView(bytes.buffer).setInt32(0, value, true);
    return bytes;
  }
  function f64(values) {
    var bytes = new Uint8Array(8 * values.length);
    var view = new DataView(bytes.buffer);
    for (var i = 0; i < values.length; i++) { view.setFloat64(8 * i, values[i], true); }
    return bytes;
  }
  function matTag(type, size) {
    var bytes = new Uint8Array(8);
    var view = new DataView(bytes.buffer);
    view.setUint32(0, type, true);
    view.setUint32(4, size, true);
    return bytes;
  }
  function concat(parts) {
    var total = 0;
    parts.forEach(function (part) { total += part.length; });
    var out = new Uint8Array(total);
    var offset = 0;
    parts.forEach(function (part) { out.set(part, offset); offset += part.length; });
    return out;
  }
  function pad8(bytes) {
    var rest = bytes.length % 8;
    return rest === 0 ? bytes : concat([bytes, new Uint8Array(8 - rest)]);
  }
  /* 数值矩阵按**列主序**装（MATLAB 的存储顺序）：box 是 n×1 的列向量，本就没有歧义 */
  function matVariable(name, box) {
    var nameBytes = new TextEncoder().encode(name);
    var body = [
      concat([matTag(6, 8), u32(box.complex ? 0x0806 : 0x0006), u32(0)]),
      concat([matTag(5, 8), i32(box.shape[0]), i32(box.shape[1])]),
      concat([matTag(1, nameBytes.length), pad8(nameBytes)])
    ];
    var rows = box.shape[0], cols = box.shape[1];
    var re = [], im = [];
    for (var j = 0; j < cols; j++) {
      for (var i = 0; i < rows; i++) {
        var at = box.complex ? 2 * (i * cols + j) : i * cols + j;
        re.push(box.values[at]);
        if (box.complex) { im.push(box.values[at + 1]); }
      }
    }
    body.push(concat([matTag(9, 8 * re.length), f64(re)]));
    if (box.complex) { body.push(concat([matTag(9, 8 * im.length), f64(im)])); }
    var payload = concat(body);
    return concat([matTag(14, payload.length), payload]);
  }
  /* struct（mxSTRUCT_CLASS）：固定槽宽的字段名数组在前，随后每个字段一个 miMATRIX。
     entries: [{key: 名字, data: 已编码的 miMATRIX 字节}] —— 值本身也可以是 struct，故可嵌套 */
  function matStruct(name, entries) {
    var width = 1;
    entries.forEach(function (entry) { width = Math.max(width, varName(entry.key).length + 1); });
    var slots = new Uint8Array(width * entries.length);
    entries.forEach(function (entry, index) {
      var key = varName(entry.key);
      for (var i = 0; i < key.length; i++) { slots[index * width + i] = key.charCodeAt(i) & 0xff; }
    });
    var nameBytes = new TextEncoder().encode(name);
    var body = [
      concat([matTag(6, 8), u32(0x0002), u32(0)]),            /* 类别 = struct */
      concat([matTag(5, 8), i32(1), i32(1)]),                 /* 1×1 */
      concat([matTag(1, nameBytes.length), pad8(nameBytes)]),
      concat([matTag(5, 4), pad8(i32(width))]),               /* 字段名槽宽（含结尾的 \0）；4 字节也要补齐 */
      concat([matTag(1, slots.length), pad8(slots)])
    ];
    entries.forEach(function (entry) { body.push(entry.data); });
    var payload = concat(body);
    return concat([matTag(14, payload.length), payload]);
  }

  /* 字符数组（mxCHAR_CLASS，元素是 UTF-16）：单位这种短文本用它 */
  function matCharVariable(name, text) {
    var data = new Uint8Array(2 * text.length);
    var view = new DataView(data.buffer);
    for (var i = 0; i < text.length; i++) { view.setUint16(2 * i, text.charCodeAt(i), true); }
    var nameBytes = new TextEncoder().encode(name);
    var body = [
      concat([matTag(6, 8), u32(0x0004), u32(0)]),            /* 类别 = char */
      concat([matTag(5, 8), i32(1), i32(text.length)]),
      concat([matTag(1, nameBytes.length), pad8(nameBytes)]),
      concat([matTag(4, data.length), pad8(data)])            /* miUINT16；数据也要补齐 */
    ];
    var payload = concat(body);
    return concat([matTag(14, payload.length), payload]);
  }

  /* 一表一个 1×1 struct，字段 = 列（n×1 列向量）：MATLAB 侧因此是 `fieldnames(m.fits)` 给表头、
     `m.fits.t1` 按名取列。单位另给一个 `units` struct（`m.units.fits.t1` = 's'）——MATLAB 的
     字段名不允许空格与方括号（实测 `'t1 [s]'` 报「字段名称无效」），所以单位只能走值。 */
  function matBytes(payload) {
    var header = new Uint8Array(128);
    var text = new TextEncoder().encode("MATLAB 5.0 MAT-file, Platform: JS, Created by qtool");
    header.set(text.subarray(0, 116), 0);
    header[124] = 0x00; header[125] = 0x01;               /* 版本 0x0100，固定大头字节序 */
    header[126] = 0x49; header[127] = 0x4d;               /* 'IM'：小端 */
    var parts = [header];
    payload.tables.forEach(function (table) {
      var entries = table.columns.map(function (column, index) {
        return { key: column.key, data: matVariable(varName(column.key), columnBox(table, index)) };
      });
      parts.push(matStruct(varName(table.name), entries));
    });
    var units = payload.tables.map(function (table) {
      var entries = table.columns.map(function (column) {
        return { key: column.key, data: matCharVariable(varName(column.key), column.unit) };
      });
      return { key: table.name, data: matStruct(varName(table.name), entries) };
    });
    parts.push(matStruct("units", units));
    return concat(parts);
  }

  function sheetName(name) { return name.replace(/[\[\]:*?\/\\]/g, "_").slice(0, 31); }
  /* .mat 里的名字必须是合法 MATLAB 标识符：其余字符换 `_`，数字开头的加 `row_` 前缀。
     数字表名只有逐行明细子表（表名即行号），所以 `m.row_0` 就是它们——MATLAB 的变量名
     不能以数字开头，不加前缀整份文件都 load 不了（实测 MATLAB:AddField:InvalidFieldName）。 */
  function varName(name) { return name.replace(/[^0-9A-Za-z_]/g, "_").replace(/^([0-9])/, "row_$1"); }

  QE.format = {
    csv: function (payload) { return textFile(payload, ",", "csv", "text/csv"); },
    txt: function (payload) { return textFile(payload, "\t", "txt", "text/plain"); },
    npz: function (payload) {
      /* 一表一个 structured npy（字段名 = 列，自带单位）；zipSync 只认 Uint8Array 叶子 */
      var entries = {};
      payload.tables.forEach(function (table) {
        entries[table.name + ".npy"] = npyStructured(table);
      });
      return { ext: "npz", mime: "application/zip",
               blob: new Blob([QE.libs.zipSync(entries)], { type: "application/zip" }) };
    },
    mat: function (payload) {
      return { ext: "mat", mime: "application/octet-stream",
               blob: new Blob([matBytes(payload)], { type: "application/octet-stream" }) };
    },
    arrow: function (payload) {
      var entries = {};
      payload.tables.forEach(function (table) {
        entries[table.name + ".arrow"] =
          QE.libs.arrow.tableToIPC(arrowTable(table), "file");
      });
      return { ext: "arrow.zip", mime: "application/zip",
               blob: new Blob([QE.libs.zipSync(entries)], { type: "application/zip" }) };
    },
    xlsx: function (payload) {
      var book = QE.libs.XLSX.utils.book_new();
      payload.tables.forEach(function (table) {
        /* 单行表头 `<列名> [<单位>]`：再插一行纯列名会让解析库把单位行当成数据 */
        var sheet = [table.columns.map(function (c) { return c.key + " [" + c.unit + "]"; })];
        var rows = tableRows(table);
        var count = rowCount(table);
        for (var i = 0; i < count; i++) {
          /* 实数落数字格（Excel 里还能继续算），复数与文本落字符串格 */
          sheet.push(table.columns.map(function (c, j) {
            var value = rows[j][i];
            return (typeof value === "number") ? value : cellText(value, c.kind);
          }));
        }
        QE.libs.XLSX.utils.book_append_sheet(book, QE.libs.XLSX.utils.aoa_to_sheet(sheet),
                                             sheetName(table.name));
      });
      var bytes = QE.libs.XLSX.write(book, { bookType: "xlsx", type: "array" });
      return { ext: "xlsx",
               mime: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
               blob: new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }) };
    }
